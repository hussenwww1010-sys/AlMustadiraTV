name: Build AlMustadira TV

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle
  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v6
    with:
      gradle-version: '8.11.1'
  - name: Check project files
    run: |
      echo "Current directory:"
      pwd
      echo "Project files:"
      ls -la
      echo "Gradle files:"
      find . -maxdepth 3 \( -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print
  - name: Build APK
    run: gradle --no-daemon assembleDebug --stacktrace --info
  - name: Verify APK
    if: success()
    run: |
      echo "Checking generated APK..."
      find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print
      test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: AlMustadira-TV-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
