<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#070914">

<title>المستديرة</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:
        radial-gradient(
            circle at 80% 5%,
            rgba(124,58,237,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(0,229,255,.10),
            transparent 30%
        ),
        #070914;
    color:#fff;
    min-height:100vh;
}

button{
    font-family:inherit;
}

.app{
    max-width:1200px;
    margin:auto;
    padding-bottom:100px;
}

/* ================= HEADER ================= */

header{
    padding:20px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-mark{
    width:48px;
    height:48px;
    border-radius:50%;
    position:relative;
    background:
        linear-gradient(
            135deg,
            #00e5ff,
            #8b5cf6
        );
    box-shadow:
        0 0 25px
        rgba(0,229,255,.25);
    overflow:hidden;
}

.logo-ball{
    position:absolute;
    width:18px;
    height:18px;
    background:#fff;
    border-radius:50%;
    top:15px;
    left:15px;
}

.logo-orbit{
    position:absolute;
    border:2px solid
        rgba(255,255,255,.8);
    border-radius:50%;
}

.orbit-1{
    width:58px;
    height:22px;
    top:12px;
    left:-5px;
    transform:rotate(-25deg);
}

.orbit-2{
    width:22px;
    height:58px;
    top:-5px;
    left:12px;
    transform:rotate(-25deg);
}

.logo-text h1{
    font-size:24px;
    font-weight:900;
}

.logo-text span{
    display:block;
    color:#9ca3af;
    font-size:12px;
    margin-top:3px;
}

.header-live{
    color:#00e5ff;
    background:rgba(255,255,255,.04);
    border:1px solid
        rgba(255,255,255,.08);
    padding:9px 14px;
    border-radius:20px;
    font-size:13px;
}

/* ================= PAGES ================= */

.page{
    display:none;
    padding:0 18px;
}

.page.active{
    display:block;
}

/* ================= HOME ================= */

.hero{
    margin:5px 0 25px;
    border-radius:25px;
    padding:30px 25px;
    min-height:220px;
    background:
        linear-gradient(
            135deg,
            rgba(14,22,50,.94),
            rgba(28,12,55,.88)
        );
    border:1px solid
        rgba(255,255,255,.07);
}

.hero h2{
    font-size:31px;
    margin-bottom:10px;
}

.hero p{
    color:#aeb6c8;
    line-height:1.8;
}

.hero-buttons{
    display:flex;
    gap:10px;
    margin-top:25px;
    flex-wrap:wrap;
}

.hero-btn{
    border:0;
    padding:12px 20px;
    border-radius:14px;
    cursor:pointer;
    color:#fff;
    background:
        linear-gradient(
            135deg,
            #00bcd4,
            #7c3aed
        );
    font-weight:bold;
}

.hero-btn.secondary{
    background:
        rgba(255,255,255,.07);
}

/* ================= TITLES ================= */

.page-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:15px 0;
}

.page-title h2{
    font-size:23px;
}

.page-title span{
    color:#8f98ab;
    font-size:13px;
}

.section-title{
    font-size:20px;
    margin:25px 0 15px;
}

/* ================= MATCHES ================= */

.date-bar{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:15px;
}

.date-btn{
    flex:0 0 auto;
    border:1px solid
        rgba(255,255,255,.08);
    background:
        rgba(255,255,255,.04);
    color:#aaa;
    border-radius:13px;
    padding:10px 18px;
    cursor:pointer;
}

.date-btn.active{
    background:
        linear-gradient(
            135deg,
            #00bcd4,
            #7c3aed
        );
    color:#fff;
}

.matches-list{
    display:grid;
    gap:12px;
}

.match-card{
    background:
        rgba(255,255,255,.045);
    border:1px solid
        rgba(255,255,255,.07);
    border-radius:20px;
    padding:18px;
}

.match-top{
    display:flex;
    justify-content:space-between;
    color:#8f98ab;
    font-size:12px;
    margin-bottom:18px;
}

.match-status{
    color:#00e5ff;
}

.teams{
    display:grid;
    grid-template-columns:
        1fr 80px 1fr;
    align-items:center;
    gap:10px;
}

.team{
    text-align:center;
    font-weight:bold;
}

.match-time{
    text-align:center;
}

.match-time strong{
    display:block;
    font-size:20px;
}

.watch-btn{
    width:100%;
    margin-top:17px;
    border:0;
    border-radius:12px;
    padding:11px;
    background:
        rgba(0,229,255,.10);
    color:#00e5ff;
    cursor:pointer;
    font-weight:bold;
}

/* ================= PLAYER ================= */

.player-box{
    background:#000;
    border-radius:22px;
    overflow:hidden;
    border:1px solid
        rgba(255,255,255,.08);
    box-shadow:
        0 20px 70px
        rgba(0,0,0,.45);
    margin-bottom:18px;
}

.video-wrap{
    position:relative;
    background:#000;
}

video{
    width:100%;
    aspect-ratio:16/9;
    display:block;
    background:#000;
}

.player-loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        rgba(0,0,0,.55);
    pointer-events:none;
}

.loading-inner{
    text-align:center;
}

.spinner{
    width:42px;
    height:42px;
    border:4px solid
        rgba(255,255,255,.15);
    border-top-color:#00e5ff;
    border-radius:50%;
    animation:
        spin .8s linear infinite;
    margin:auto auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.player-info{
    padding:16px;
    background:
        linear-gradient(
            135deg,
            #11162b,
            #0c0d18
        );
}

.current-channel{
    display:flex;
    align-items:center;
    gap:12px;
}

.current-logo{
    width:48px;
    height:48px;
    object-fit:contain;
    border-radius:12px;
    background:
        rgba(255,255,255,.06);
}

.current-channel h2{
    font-size:17px;
}

.current-channel p{
    color:#8992a5;
    font-size:12px;
    margin-top:5px;
}

.player-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.player-action{
    flex:1;
    border:1px solid
        rgba(255,255,255,.08);
    background:
        rgba(255,255,255,.05);
    color:#fff;
    border-radius:12px;
    padding:11px;
    cursor:pointer;
}

.player-action:hover{
    background:
        rgba(0,229,255,.10);
}

/* ================= CHANNEL HEADER ================= */

.channels-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:20px 0 12px;
}

.channels-header h2{
    font-size:19px;
}

.channels-header span{
    color:#818a9c;
    font-size:12px;
}

/* ================= CHANNELS ================= */

.channels-grid{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);
    gap:12px;
}

.channel-card{
    position:relative;
    background:
        rgba(255,255,255,.045);
    border:1px solid
        rgba(255,255,255,.07);
    border-radius:18px;
    padding:18px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.channel-card:hover{
    transform:translateY(-2px);
    border-color:
        rgba(0,229,255,.45);
}

.channel-card.selected{
    border-color:#00e5ff;
    background:
        rgba(0,229,255,.07);
    box-shadow:
        0 0 25px
        rgba(0,229,255,.08);
}

.channel-logo{
    width:62px;
    height:62px;
    border-radius:15px;
    object-fit:contain;
    margin-bottom:10px;
    background:
        rgba(255,255,255,.06);
}

.channel-card h3{
    font-size:14px;
}

.channel-status{
    display:block;
    margin-top:8px;
    font-size:11px;
    color:#00e5ff;
}

.selected-badge{
    position:absolute;
    top:8px;
    left:8px;
    background:#00e5ff;
    color:#001015;
    font-size:9px;
    font-weight:bold;
    padding:4px 7px;
    border-radius:8px;
}

/* ================= NEWS ================= */

.news-list{
    display:grid;
    gap:12px;
}

.news-card{
    display:flex;
    gap:14px;
    padding:15px;
    border-radius:18px;
    background:
        rgba(255,255,255,.045);
    border:1px solid
        rgba(255,255,255,.07);
}

.news-image{
    width:100px;
    height:75px;
    border-radius:12px;
    object-fit:cover;
    background:
        rgba(255,255,255,.06);
}

.news-card h3{
    font-size:15px;
    margin-bottom:7px;
}

.news-card p{
    color:#969fb2;
    font-size:12px;
    line-height:1.6;
}

/* ================= EMPTY ================= */

.empty{
    text-align:center;
    padding:50px 20px;
    color:#8f98aa;
}

.empty-icon{
    font-size:45px;
    margin-bottom:15px;
}

/* ================= NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    width:min(
        600px,
        calc(100% - 24px)
    );
    background:
        rgba(12,15,30,.94);
    backdrop-filter:blur(18px);
    border:1px solid
        rgba(255,255,255,.08);
    border-radius:22px;
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    padding:8px;
    z-index:1000;
    box-shadow:
        0 10px 40px
        rgba(0,0,0,.35);
}

.nav-btn{
    border:0;
    background:transparent;
    color:#777f92;
    padding:9px 4px;
    border-radius:15px;
    cursor:pointer;
    font-size:12px;
}

.nav-btn.active{
    color:#fff;
    background:
        rgba(0,229,255,.09);
}

.nav-icon{
    display:block;
    font-size:20px;
    margin-bottom:3px;
}

/* ================= RESPONSIVE ================= */

@media(min-width:700px){

    .matches-list{
        grid-template-columns:
            repeat(2,1fr);
    }

    .channels-grid{
        grid-template-columns:
            repeat(4,1fr);
    }

}

@media(max-width:500px){

    .hero h2{
        font-size:27px;
    }

    .player-info{
        padding:13px;
    }

}

</style>

</head>


<body>

<div class="app">


<header>

    <div class="logo">

        <div class="logo-mark">

            <div class="logo-ball"></div>

            <div class="logo-orbit orbit-1"></div>

            <div class="logo-orbit orbit-2"></div>

        </div>

        <div class="logo-text">

            <h1>المستديرة</h1>

            <span>
                كل الرياضة بمكان واحد
            </span>

        </div>

    </div>

    <div class="header-live">
        ● مباشر
    </div>

</header>


<!-- ================= HOME ================= -->

<section id="home"
         class="page active">

    <div class="hero">

        <h2>
            عالم الرياضة بين إيديك ⚽
        </h2>

        <p>
            تابع المباريات والبث المباشر
            والأخبار الرياضية من مكان واحد.
        </p>

        <div class="hero-buttons">

            <button
                class="hero-btn"
                onclick="openPage('matches')">

                ⚽ المباريات

            </button>

            <button
                class="hero-btn secondary"
                onclick="openPage('live')">

                📺 البث المباشر

            </button>

        </div>

    </div>


    <h2 class="section-title">
        🔥 مباريات اليوم
    </h2>

    <div id="homeMatches"
         class="matches-list">
    </div>

</section>


<!-- ================= MATCHES ================= -->

<section id="matches"
         class="page">

    <div class="page-title">

        <h2>
            ⚽ المباريات
        </h2>

        <span id="matchCount">
            0 مباراة
        </span>

    </div>


    <div class="date-bar">

        <button class="date-btn active">
            اليوم
        </button>

        <button class="date-btn">
            غداً
        </button>

        <button class="date-btn">
            السبت
        </button>

        <button class="date-btn">
            الأحد
        </button>

    </div>


    <div id="matchesList"
         class="matches-list">
    </div>

</section>


<!-- ================= LIVE ================= -->

<section id="live"
         class="page">

    <div class="page-title">

        <h2>
            📺 البث المباشر
        </h2>

        <span>
            القنوات
        </span>

    </div>


    <!-- PLAYER -->

    <div id="playerBox"
         class="player-box"
         style="display:none;">

        <div class="video-wrap">

            <video id="video"
                   controls
                   playsinline>
            </video>


            <div id="loading"
                 class="player-loading"
                 style="display:none;">

                <div class="loading-inner">

                    <div class="spinner"></div>

                    <div>
                        جاري الاتصال بالبث...
                    </div>

                </div>

            </div>

        </div>


        <div class="player-info">

            <div class="current-channel">

                <img id="currentLogo"
                     class="current-logo"
                     src=""
                     alt="">

                <div>

                    <h2 id="playerTitle">
                        اختر قناة
                    </h2>

                    <p id="playerStatus">
                        جاهز للمشاهدة
                    </p>

                </div>

            </div>


            <div class="player-actions">

                <button
                    class="player-action"
                    onclick="retryCurrentChannel()">

                    🔄 إعادة الاتصال

                </button>


                <button
                    class="player-action"
                    onclick="fullscreenPlayer()">

                    ⛶ ملء الشاشة

                </button>


                <button
                    class="player-action"
                    onclick="closePlayer()">

                    ✕ إغلاق

                </button>

            </div>

        </div>

    </div>


    <div class="channels-header">

        <h2>
            القنوات الرياضية
        </h2>

        <span id="channelCount">
            0 قناة
        </span>

    </div>


    <div id="channelsList"
         class="channels-grid">
    </div>

</section>


<!-- ================= NEWS ================= -->

<section id="news"
         class="page">

    <div class="page-title">

        <h2>
            📰 الأخبار
        </h2>

        <span>
            آخر الأخبار
        </span>

    </div>


    <div id="newsList"
         class="news-list">
    </div>

</section>


</div>


<!-- ================= NAV ================= -->

<nav class="bottom-nav">

    <button
        class="nav-btn active"
        onclick="openPage('home',this)">

        <span class="nav-icon">
            ⌂
        </span>

        الرئيسية

    </button>


    <button
        class="nav-btn"
        onclick="openPage('matches',this)">

        <span class="nav-icon">
            ⚽
        </span>

        المباريات

    </button>


    <button
        class="nav-btn"
        onclick="openPage('live',this)">

        <span class="nav-icon">
            📺
        </span>

        البث

    </button>


    <button
        class="nav-btn"
        onclick="openPage('news',this)">

        <span class="nav-icon">
            📰
        </span>

        الأخبار

    </button>

</nav>


<script>

/* ================= DATA ================= */

let appData = {

    matches:[],
    channels:[],
    news:[]

};


let hlsPlayer = null;

let currentChannelIndex = -1;

let retryTimer = null;


/* ================= LOAD DATA ================= */

async function loadData(){

    try{

        const response =
            await fetch(
                "data.json?v=" +
                Date.now()
            );


        if(!response.ok){

            throw new Error(
                "Data error"
            );

        }


        appData =
            await response.json();


        renderMatches();

        renderHomeMatches();

        renderChannels();

        renderNews();


    }catch(error){

        console.error(error);

        document.getElementById(
            "matchesList"
        ).innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                تعذر تحميل البيانات

            </div>

        `;

    }

}


/* ================= NAV ================= */

function openPage(
    pageName,
    button
){

    document
    .querySelectorAll(".page")
    .forEach(page=>{

        page.classList.remove(
            "active"
        );

    });


    const page =
        document.getElementById(
            pageName
        );


    if(page){

        page.classList.add(
            "active"
        );

    }


    document
    .querySelectorAll(".nav-btn")
    .forEach(btn=>{

        btn.classList.remove(
            "active"
        );

    });


    if(button){

        button.classList.add(
            "active"
        );

    }


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ================= MATCH CARD ================= */

function matchCard(match){

    return `

        <div class="match-card">

            <div class="match-top">

                <span>
                    ${match.league || "مباراة"}
                </span>

                <span class="match-status">
                    ${match.status || "لم تبدأ"}
                </span>

            </div>


            <div class="teams">

                <div class="team">
                    ${match.team1 || "الفريق الأول"}
                </div>


                <div class="match-time">

                    <strong>
                        ${match.time || "--:--"}
                    </strong>

                </div>


                <div class="team">
                    ${match.team2 || "الفريق الثاني"}
                </div>

            </div>


            <button
                class="watch-btn"
                onclick="openPage('live')">

                📺 مشاهدة المباراة

            </button>

        </div>

    `;

}


/* ================= MATCHES ================= */

function renderMatches(){

    const container =
        document.getElementById(
            "matchesList"
        );


    const count =
        document.getElementById(
            "matchCount"
        );


    if(
        !appData.matches ||
        !appData.matches.length
    ){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚽
                </div>

                لا توجد مباريات حالياً

            </div>

        `;


        count.innerText =
            "0 مباراة";

        return;

    }


    container.innerHTML =
        appData.matches
        .map(match =>
            matchCard(match)
        )
        .join("");


    count.innerText =
        appData.matches.length +
        " مباراة";

}


function renderHomeMatches(){

    const container =
        document.getElementById(
            "homeMatches"
        );


    if(
        !appData.matches ||
        !appData.matches.length
    ){

        container.innerHTML =
            `<div class="empty">
                لا توجد مباريات اليوم
             </div>`;

        return;

    }


    container.innerHTML =
        appData.matches
        .slice(0,3)
        .map(match =>
            matchCard(match)
        )
        .join("");

}


/* ================= CHANNELS ================= */

function renderChannels(){

    const container =
        document.getElementById(
            "channelsList"
        );


    const count =
        document.getElementById(
            "channelCount"
        );


    const channels =
        (appData.channels || [])
        .filter(channel =>
            channel.enabled !== false
        );


    count.innerText =
        channels.length +
        " قناة";


    if(!channels.length){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📺
                </div>

                لا توجد قنوات حالياً

            </div>

        `;

        return;

    }


    container.innerHTML =
        channels
        .map((channel,index)=>{

            const originalIndex =
                appData.channels.indexOf(
                    channel
                );


            const selected =
                originalIndex ===
                currentChannelIndex;


            return `

                <div
                    class="
                        channel-card
                        ${selected
                            ? "selected"
                            : ""}
                    "
                    onclick="
                        playChannel(
                            ${originalIndex}
                        )
                    "
                >

                    ${
                        selected
                        ?
                        `<span class="selected-badge">
                            الآن
                         </span>`
                        :
                        ""
                    }


                    ${
                        channel.logo
                        ?
                        `<img
                            class="channel-logo"
                            src="${channel.logo}"
                            alt=""
                        >`
                        :
                        `<div
                            class="channel-logo">
                         </div>`
                    }


                    <h3>
                        ${
                            channel.name ||
                            "قناة رياضية"
                        }
                    </h3>


                    <span class="channel-status">

                        ●
                        ${
                            channel.url
                            ? "متاحة للمشاهدة"
                            : "بانتظار الرابط"
                        }

                    </span>

                </div>

            `;

        })
        .join("");

}


/* ================= NEWS ================= */

function renderNews(){

    const container =
        document.getElementById(
            "newsList"
        );


    if(
        !appData.news ||
        !appData.news.length
    ){

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📰
                </div>

                لا توجد أخبار حالياً

            </div>

        `;

        return;

    }


    container.innerHTML =
        appData.news
        .map(news=>`

            <article
                class="news-card">

                ${
                    news.image
                    ?
                    `<img
                        class="news-image"
                        src="${news.image}"
                        alt=""
                    >`
                    :
                    `<div
                        class="news-image">
                     </div>`
                }


                <div>

                    <h3>
                        ${
                            news.title ||
                            "خبر رياضي"
                        }
                    </h3>


                    <p>
                        ${
                            news.description ||
                            ""
                        }
                    </p>

                </div>

            </article>

        `)
        .join("");

}


/* ================= PLAY CHANNEL ================= */

function playChannel(index){

    const channel =
        appData.channels[index];


    if(!channel){

        return;

    }


    currentChannelIndex =
        index;


    renderChannels();


    openPage("live");


    const playerBox =
        document.getElementById(
            "playerBox"
        );


    playerBox.style.display =
        "block";


    document.getElementById(
        "playerTitle"
    ).innerText =
        channel.name ||
        "قناة رياضية";


    document.getElementById(
        "playerStatus"
    ).innerText =
        "جاري الاتصال بالبث...";


    const logo =
        document.getElementById(
            "currentLogo"
        );


    if(channel.logo){

        logo.src =
            channel.logo;

        logo.style.display =
            "block";

    }else{

        logo.removeAttribute("src");

        logo.style.display =
            "none";

    }


    const loading =
        document.getElementById(
            "loading"
        );


    loading.style.display =
        "flex";


    startStream(channel);

}


/* ================= START STREAM ================= */

function startStream(channel){

    clearTimeout(retryTimer);


    const video =
        document.getElementById(
            "video"
        );


    if(hlsPlayer){

        hlsPlayer.destroy();

        hlsPlayer =
            null;

    }


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    const url =
        channel.url || "";


    if(!url){

        hideLoading();


        document.getElementById(
            "playerStatus"
        ).innerText =
            "رابط البث غير مضاف";


        return;

    }


    /*
      Safari / iPhone
      يدعم HLS مباشرة
    */

    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            url;


        video.addEventListener(
            "loadedmetadata",
            onVideoReady,
            {once:true}
        );


        video.addEventListener(
            "error",
            onVideoError,
            {once:true}
        );


        video.play()
        .catch(()=>{});


        return;

    }


    /*
      HLS.js
    */

    if(
        typeof Hls !== "undefined" &&
        Hls.isSupported()
    ){

        hlsPlayer =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                maxBufferLength:20,

                backBufferLength:10

            });


        hlsPlayer.loadSource(
            url
        );


        hlsPlayer.attachMedia(
            video
        );


        hlsPlayer.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                onVideoReady();

                video.play()
                .catch(()=>{});

            }
        );


        hlsPlayer.on(
            Hls.Events.ERROR,
            function(
                event,
                data
            ){

                console.log(
                    "HLS error:",
                    data
                );


                if(data.fatal){

                    onStreamError(
                        data.type
                    );

                }

            }
        );


        return;

    }


    hideLoading();


    document.getElementById(
        "playerStatus"
    ).innerText =
        "هذا المتصفح لا يدعم HLS";

}


/* ================= VIDEO READY ================= */

function onVideoReady(){

    hideLoading();


    document.getElementById(
        "playerStatus"
    ).innerText =
        "● البث يعمل الآن";

}


/* ================= ERROR ================= */

function onVideoError(){

    onStreamError(
        "video"
    );

}


function onStreamError(type){

    hideLoading();


    document.getElementById(
        "playerStatus"
    ).innerText =
        "حدث خطأ... جاري إعادة الاتصال";


    retryTimer =
        setTimeout(
            retryCurrentChannel,
            3000
        );

}


/* ================= RETRY ================= */

function retryCurrentChannel(){

    if(
        currentChannelIndex <
        0
    ){

        return;

    }


    const channel =
        appData.channels[
            currentChannelIndex
        ];


    if(!channel){

        return;

    }


    document.getElementById(
        "playerStatus"
    ).innerText =
        "جاري إعادة الاتصال...";


    document.getElementById(
        "loading"
    ).style.display =
        "flex";


    startStream(channel);

}


/* ================= CLOSE ================= */

function closePlayer(){

    clearTimeout(
        retryTimer
    );


    const video =
        document.getElementById(
            "video"
        );


    video.pause();


    if(hlsPlayer){

        hlsPlayer.destroy();

        hlsPlayer =
            null;

    }


    video.removeAttribute(
        "src"
    );

    video.load();


    document.getElementById(
        "playerBox"
    ).style.display =
        "none";


    currentChannelIndex =
        -1;


    renderChannels();

}


/* ================= FULLSCREEN ================= */

function fullscreenPlayer(){

    const video =
        document.getElementById(
            "video"
        );


    if(
        document.fullscreenElement
    ){

        document.exitFullscreen();

        return;

    }


    if(
        video.requestFullscreen
    ){

        video.requestFullscreen();

    }
    else if(
        video.webkitEnterFullscreen
    ){

        video.webkitEnterFullscreen();

    }

}


/* ================= DATES ================= */

document
.querySelectorAll(".date-btn")
.forEach(button=>{

    button.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(
                ".date-btn"
            )
            .forEach(btn=>{

                btn.classList.remove(
                    "active"
                );

            });


            this.classList.add(
                "active"
            );

        }
    );

});


/* ================= START ================= */

loadData();
