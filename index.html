<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#060913">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>المستديرة TV | القنوات الرياضية</title>

<!-- HLS.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --bg-main: #060913;
    --bg-card: rgba(18, 26, 43, 0.65);
    --bg-card-hover: rgba(28, 40, 66, 0.85);
    --border-color: rgba(255, 255, 255, 0.08);
    --accent: #00f2fe;
    --accent-glow: rgba(0, 242, 254, 0.25);
    --accent-secondary: #4facfe;
    --text-primary: #ffffff;
    --text-secondary: #8e9bb0;
    --danger: #ff3b5c;
    --radius-xl: 24px;
    --radius-md: 14px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    min-height: 100vh;
    background-color: var(--bg-main);
    background-image: 
        radial-gradient(circle at 15% 15%, rgba(79, 172, 254, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.08) 0%, transparent 40%);
    background-attachment: fixed;
    color: var(--text-primary);
    overflow-x: hidden;
    padding-bottom: 40px;
}

button, input {
    font: inherit;
    outline: none;
    border: none;
}

/* ================= HEADER ================= */
.header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    background: rgba(6, 9, 19, 0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-color);
}

.logo {
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    background: none;
}

.logo-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent-secondary), var(--accent));
    display: grid;
    place-items: center;
    color: #000;
    font-size: 20px;
    box-shadow: 0 0 20px var(--accent-glow);
}

.logo-text h1 {
    font-size: 20px;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1.2;
    text-align: right;
}

.logo-text span {
    font-size: 10px;
    color: var(--text-secondary);
    letter-spacing: 1.5px;
    display: block;
    font-weight: 600;
}

.search-box {
    position: relative;
    width: 320px;
}

.search-box input {
    width: 100%;
    height: 46px;
    padding: 0 45px 0 20px;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-color);
    color: #fff;
    font-size: 14px;
    transition: var(--transition);
}

.search-box input:focus {
    background: rgba(255, 255, 255, 0.08);
    border-color: var(--accent);
    box-shadow: 0 0 15px var(--accent-glow);
}

.search-box i {
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-secondary);
    font-size: 15px;
}

/* ================= MAIN CONTAINER ================= */
main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 4%;
}

/* Category Filters */
.categories-wrapper {
    margin-bottom: 35px;
}

.categories-title {
    font-size: 14px;
    color: var(--text-secondary);
    margin-bottom: 12px;
    font-weight: 600;
}

.categories-flex {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
    scrollbar-width: none;
}

.categories-flex::-webkit-scrollbar {
    display: none;
}

.cat-btn {
    flex: 0 0 auto;
    padding: 10px 22px;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
}

.cat-btn:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
}

.cat-btn.active {
    background: linear-gradient(135deg, var(--accent-secondary), var(--accent));
    color: #000;
    border-color: transparent;
    box-shadow: 0 4px 15px var(--accent-glow);
}

/* Channels Grid */
.channel-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
}

.channel-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-xl);
    padding: 24px 20px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    cursor: pointer;
    transition: var(--transition);
    backdrop-filter: blur(10px);
    overflow: hidden;
}

.channel-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, var(--accent-glow), transparent 70%);
    opacity: 0;
    transition: var(--transition);
}

.channel-card:hover {
    transform: translateY(-6px);
    background: var(--bg-card-hover);
    border-color: rgba(0, 242, 254, 0.4);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
}

.channel-card:hover::before {
    opacity: 1;
}

.logo-wrapper {
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    margin-bottom: 16px;
}

.channel-logo {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
    transition: var(--transition);
}

.channel-card:hover .channel-logo {
    transform: scale(1.08);
}

.logo-fallback {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
    border: 1px solid var(--border-color);
    display: grid;
    place-items: center;
    font-size: 28px;
    color: var(--accent);
}

.channel-info {
    width: 100%;
    text-align: center;
    position: z-index: 1;
}

.channel-name {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.channel-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding-top: 12px;
    border-top: 1px solid var(--border-color);
}

.channel-cat {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 600;
}

.badge-wrap {
    display: flex;
    gap: 6px;
}

.badge-live {
    background: rgba(255, 59, 92, 0.15);
    color: var(--danger);
    border: 1px solid rgba(255, 59, 92, 0.3);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 4px;
}

.badge-live::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--danger);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
}

.quality-badge {
    background: rgba(0, 242, 254, 0.1);
    color: var(--accent);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 800;
    border: 1px solid rgba(0, 242, 254, 0.2);
}

@keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
}

/* Empty State */
.empty-box {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    background: var(--bg-card);
    border: 1px dashed var(--border-color);
    border-radius: var(--radius-xl);
}

.empty-box i {
    font-size: 48px;
    color: var(--text-secondary);
    margin-bottom: 15px;
}

.empty-box h3 {
    font-size: 18px;
    margin-bottom: 8px;
}

.empty-box p {
    color: var(--text-secondary);
    font-size: 13px;
}

/* ================= PLAYER MODAL ================= */
.player-modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(2, 4, 10, 0.92);
    backdrop-filter: blur(15px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.player-modal.show {
    display: flex;
    opacity: 1;
}

.player-container {
    width: min(1000px, 100%);
    background: #0b0f19;
    border-radius: 20px;
    border: 1px solid var(--border-color);
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
}

.player-header {
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.02);
    border-bottom: 1px solid var(--border-color);
}

.player-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 16px;
}

.btn-close {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: var(--transition);
}

.btn-close:hover {
    background: var(--danger);
}

.video-screen {
    position: relative;
    aspect-ratio: 16 / 9;
    background: #000;
}

.video-screen video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.player-overlay-state {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    background: rgba(0, 0, 0, 0.8);
    padding: 20px;
    text-align: center;
}

.player-overlay-state.active {
    display: flex;
}

.spinner {
    width: 45px;
    height: 45px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.player-controls-bar {
    padding: 14px 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    background: rgba(255, 255, 255, 0.02);
    border-top: 1px solid var(--border-color);
}

.btn-action {
    padding: 8px 16px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: var(--transition);
}

.btn-action:hover {
    background: rgba(255, 255, 255, 0.15);
}

/* ================= RESPONSIVE ================= */
@media (max-width: 768px) {
    .header {
        height: 70px;
        padding: 0 4%;
    }
    .search-box {
        width: 180px;
    }
    .search-box input {
        height: 40px;
        font-size: 12px;
    }
    .channel-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
    }
    .channel-card {
        padding: 18px 12px 14px;
        border-radius: 16px;
    }
    .logo-wrapper {
        width: 70px;
        height: 70px;
    }
    .channel-name {
        font-size: 14px;
    }
}
</style>
</head>
<body>

<header class="header">
    <button class="logo" onclick="window.location.reload()">
        <div class="logo-icon"><i class="fa-solid fa-tv"></i></div>
        <div class="logo-text">
            <h1>المستديرة TV</h1>
            <span>LIVE TV PLATFORM</span>
        </div>
    </button>

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="searchInput" type="search" placeholder="ابحث عن قناة..." oninput="onSearchInput(this.value)">
    </div>
</header>

<main>
    <section class="categories-wrapper">
        <div class="categories-title">تصفح القنوات حسب التصنيف:</div>
        <div id="categoryFilters" class="categories-flex"></div>
    </section>

    <section id="channelGrid" class="channel-grid"></section>
</main>

<!-- Player Modal -->
<div id="playerModal" class="player-modal" onclick="onModalClick(event)">
    <div class="player-container">
        <div class="player-header">
            <div class="player-title">
                <i class="fa-solid fa-circle-play" style="color: var(--accent);"></i>
                <span id="playerTitleText">مشغل البث</span>
            </div>
            <button class="btn-close" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="video-screen">
            <video id="videoPlayer" controls playsinline preload="metadata"></video>
            
            <div id="playerLoading" class="player-overlay-state">
                <div class="spinner"></div>
                <span>جاري تحميل البث المباشر...</span>
            </div>

            <div id="playerError" class="player-overlay-state">
                <i class="fa-solid fa-circle-exclamation" style="font-size: 36px; color: var(--danger);"></i>
                <p id="playerErrorText">تعذر تشغيل هذا البث حالياً.</p>
                <button class="btn-action" onclick="retryStream()" style="background: var(--accent); color: #000;">
                    <i class="fa-solid fa-rotate-right"></i> إعادة المحاولة
                </button>
            </div>
        </div>

        <div class="player-controls-bar">
            <button class="btn-action" onclick="toggleFullscreen()">
                <i class="fa-solid fa-expand"></i> ملء الشاشة
            </button>
        </div>
    </div>
</div>

<script>
let DATA = { channels: [] };
let activeCategory = "الكل";
let currentSearchQuery = "";
let hlsInstance = null;
let currentStreamUrl = "";

/* Load Channels Data */
async function loadChannelsData() {
    try {
        const res = await fetch("data.json?v=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP error " + res.status);
        const json = await res.json();
        
        DATA.channels = Array.isArray(json.channels) 
            ? json.channels.filter(c => c.enabled !== false) 
            : [];

        renderCategories();
        renderChannels();
    } catch (err) {
        console.error("Data loading error:", err);
        document.getElementById("channelGrid").innerHTML = `
            <div class="empty-box">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <h3>تعذر تحميل القنوات</h3>
                <p>يرجى التأكد من وجود ملف data.json بشكل صحيح في الخادم.</p>
            </div>
        `;
    }
}

/* Categories Bar */
function renderCategories() {
    const box = document.getElementById("categoryFilters");
    const categories = ["الكل", ...new Set(DATA.channels.map(c => c.category).filter(Boolean))];

    box.innerHTML = categories.map(cat => `
        <button class="cat-btn ${cat === activeCategory ? 'active' : ''}" 
                onclick="selectCategory('${escapeHtml(cat)}', this)">
            ${escapeHtml(cat)}
        </button>
    `).join("");
}

function selectCategory(cat, btn) {
    activeCategory = cat;
    document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderChannels();
}

function onSearchInput(val) {
    currentSearchQuery = val.trim().toLowerCase();
    renderChannels();
}

/* Render Channels Grid */
function renderChannels() {
    const grid = document.getElementById("channelGrid");
    
    const filtered = DATA.channels.filter(c => {
        const matchesCategory = activeCategory === "الكل" || c.category === activeCategory;
        const matchesSearch = !currentSearchQuery || 
            (c.name && c.name.toLowerCase().includes(currentSearchQuery)) ||
            (c.category && c.category.toLowerCase().includes(currentSearchQuery));
        return matchesCategory && matchesSearch;
    });

    if (!filtered.length) {
        grid.innerHTML = `
            <div class="empty-box">
                <i class="fa-solid fa-tv"></i>
                <h3>لم يتم العثور على أي قنوات</h3>
                <p>جرّب البحث باسم آخر أو اختيار تصنيف مختلف.</p>
            </div>
        `;
        return;
    }

    grid.innerHTML = filtered.map(ch => `
        <article class="channel-card" onclick="openPlayer(${ch.id})">
            <div class="logo-wrapper">
                ${ch.logo ? `
                    <img class="channel-logo" src="${escapeHtml(ch.logo)}" alt="${escapeHtml(ch.name)}" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'logo-fallback\\'><i class=\\'fa-solid fa-play\\'></i></div>';">
                ` : `
                    <div class="logo-fallback"><i class="fa-solid fa-play"></i></div>
                `}
            </div>
            <div class="channel-info">
                <div class="channel-name" title="${escapeHtml(ch.name)}">${escapeHtml(ch.name || "قناة رياضية")}</div>
                <div class="channel-meta">
                    <span class="channel-cat">${escapeHtml(ch.category || "عامة")}</span>
                    <div class="badge-wrap">
                        <span class="badge-live">مباشر</span>
                        <span class="quality-badge">${escapeHtml(ch.quality || "HD")}</span>
                    </div>
                </div>
            </div>
        </article>
    `).join("");
}

/* Video Player Handlers */
function openPlayer(id) {
    const channel = DATA.channels.find(c => Number(c.id) === Number(id));
    if (!channel || !channel.url) {
        alert("رابط البث غير متوفر حالياً لهذه القناة.");
        return;
    }

    currentStreamUrl = channel.url;
    document.getElementById("playerTitleText").textContent = channel.name || "البث المباشر";
    
    const modal = document.getElementById("playerModal");
    modal.classList.add("show");
    
    startStream(channel.url);
}

function startStream(url) {
    const video = document.getElementById("videoPlayer");
    destroyHls();
    showLoading();
    hideError();

    video.src = "";

    // Apple Native HLS Support
    if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = url;
        video.addEventListener("loadedmetadata", () => {
            hideLoading();
            video.play().catch(() => {});
        }, { once: true });
        video.addEventListener("error", () => {
            showError("تعذر تشغيل هذا الرابط عبر المشغل الأصلي.");
        }, { once: true });
        return;
    }

    // HLS.js Support
    if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            backBufferLength: 30
        });

        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            hideLoading();
            video.play().catch(() => {});
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
            if (!data.fatal) return;
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                try { hlsInstance.startLoad(); } catch (e) { showError("خطأ في الاتصال بالشبكة."); }
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                try { hlsInstance.recoverMediaError(); } catch (e) { showError("فشل في معالجة الفيديو."); }
            } else {
                showError("تعذر تشغيل هذا البث، قد تكون القناة غير متاحة الآن.");
            }
        });
        return;
    }

    showError("متصفحك لا يدعم تقنية تشغيل هذا البث.");
}

function closePlayer() {
    destroyHls();
    document.getElementById("playerModal").classList.remove("show");
}

function destroyHls() {
    if (hlsInstance) {
        try { hlsInstance.destroy(); } catch (e) {}
        hlsInstance = null;
    }
    const video = document.getElementById("videoPlayer");
    try { video.pause(); } catch (e) {}
    video.removeAttribute("src");
    try { video.load(); } catch (e) {}
}

function showLoading() {
    document.getElementById("playerLoading").classList.add("active");
}
function hideLoading() {
    document.getElementById("playerLoading").classList.remove("active");
}
function showError(msg) {
    hideLoading();
    document.getElementById("playerErrorText").textContent = msg;
    document.getElementById("playerError").classList.add("active");
}
function hideError() {
    document.getElementById("playerError").classList.remove("active");
}
function retryStream() {
    if (currentStreamUrl) startStream(currentStreamUrl);
}

function toggleFullscreen() {
    const video = document.getElementById("videoPlayer");
    if (document.fullscreenElement) {
        document.exitFullscreen();
    } else if (video.requestFullscreen) {
        video.requestFullscreen();
    } else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
    }
}

function onModalClick(e) {
    if (e.target === e.currentTarget) closePlayer();
}

function escapeHtml(str) {
    return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closePlayer();
});

// Run Init
loadChannelsData();
</script>
</body>
</html>
