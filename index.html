<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b14">

<title>المستديرة</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:
        radial-gradient(circle at 15% 0%,rgba(0,229,255,.08),transparent 30%),
        radial-gradient(circle at 100% 15%,rgba(124,58,237,.12),transparent 32%),
        #070b14;
    color:#fff;
    min-height:100vh;
    padding-bottom:90px;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:100;
    height:72px;
    padding:0 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(7,11,20,.88);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.06);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logoMark{
    width:43px;
    height:43px;
    border-radius:14px;
    background:linear-gradient(135deg,#00e5ff,#7c3aed);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    box-shadow:0 0 25px rgba(0,229,255,.18);
}

.logoMark:before{
    content:"";
    width:18px;
    height:18px;
    border:2px solid white;
    border-radius:50%;
}

.logoMark:after{
    content:"";
    position:absolute;
    width:30px;
    height:11px;
    border:2px solid rgba(255,255,255,.9);
    border-left-color:transparent;
    border-right-color:transparent;
    border-radius:50%;
    transform:rotate(-25deg);
}

.brandText h1{
    font-size:20px;
    font-weight:900;
}

.brandText span{
    display:block;
    margin-top:3px;
    color:#8792a5;
    font-size:10px;
}

.liveStatus{
    display:flex;
    align-items:center;
    gap:7px;
    color:#a4adbb;
    font-size:12px;
}

.liveDot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 12px #22c55e;
}

/* ================= MAIN ================= */

main{
    max-width:1250px;
    margin:auto;
    padding:22px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* ================= HERO ================= */

.hero{
    min-height:260px;
    padding:36px;
    margin-bottom:28px;
    border-radius:28px;
    overflow:hidden;
    position:relative;
    background:
        radial-gradient(circle at 85% 20%,rgba(0,229,255,.20),transparent 35%),
        radial-gradient(circle at 10% 100%,rgba(124,58,237,.22),transparent 40%),
        linear-gradient(135deg,#10182b,#0b1020);
    border:1px solid rgba(255,255,255,.07);
}

.hero:after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border:1px solid rgba(255,255,255,.06);
    border-radius:50%;
    left:-120px;
    top:-120px;
}

.heroContent{
    position:relative;
    z-index:2;
    max-width:650px;
}

.heroBadge{
    display:inline-flex;
    padding:7px 13px;
    border-radius:30px;
    background:rgba(0,229,255,.10);
    color:#00e5ff;
    font-size:12px;
    margin-bottom:15px;
}

.hero h2{
    font-size:40px;
    line-height:1.2;
    margin-bottom:13px;
}

.hero p{
    color:#aeb7c7;
    line-height:1.8;
    font-size:15px;
}

/* ================= SECTION ================= */

.sectionTitle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:25px 0 15px;
}

.sectionTitle h2{
    font-size:20px;
}

.count{
    color:#8792a5;
    font-size:12px;
}

/* ================= DATE BAR ================= */

.dateBar{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:18px;
}

.dateBtn{
    min-width:105px;
    padding:12px 15px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.07);
    background:#101725;
    color:#98a3b4;
}

.dateBtn.active{
    color:#fff;
    border-color:transparent;
    background:linear-gradient(135deg,#00a8c4,#6d28d9);
}

/* ================= MATCHES ================= */

.matchesGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
    gap:15px;
}

.matchCard{
    position:relative;
    overflow:hidden;
    padding:18px;
    border-radius:22px;
    background:
        linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),
        #0d1422;
    border:1px solid rgba(255,255,255,.06);
    transition:.2s;
}

.matchCard:hover{
    transform:translateY(-3px);
    border-color:rgba(0,229,255,.25);
}

.matchTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
}

.league{
    color:#8994a6;
    font-size:11px;
}

.matchStatus{
    padding:5px 8px;
    border-radius:8px;
    font-size:9px;
}

.statusSoon{
    color:#00e5ff;
    background:rgba(0,229,255,.08);
}

.statusLive{
    color:#22c55e;
    background:rgba(34,197,94,.10);
}

.statusEnded{
    color:#8b95a6;
    background:rgba(255,255,255,.06);
}

.matchTeams{
    display:grid;
    grid-template-columns:1fr 70px 1fr;
    align-items:center;
    gap:8px;
}

.matchTeam{
    text-align:center;
}

.teamIcon{
    width:48px;
    height:48px;
    margin:auto auto 9px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#121e32,#19243a);
    color:#00e5ff;
    font-size:20px;
}

.teamName{
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.matchCenter{
    text-align:center;
}

.matchTime{
    font-size:19px;
    font-weight:900;
}

.matchDate{
    margin-top:4px;
    color:#737f92;
    font-size:9px;
}

.matchBottom{
    display:flex;
    justify-content:center;
    margin-top:17px;
    padding-top:13px;
    border-top:1px solid rgba(255,255,255,.05);
    color:#788497;
    font-size:10px;
}

/* ================= LIVE ================= */

.searchBox{
    position:relative;
    margin-bottom:13px;
}

.searchBox input{
    width:100%;
    height:52px;
    padding:0 48px 0 18px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.08);
    outline:none;
    background:#0d1422;
    color:#fff;
    font-size:14px;
}

.searchBox input:focus{
    border-color:rgba(0,229,255,.5);
}

.searchIcon{
    position:absolute;
    right:17px;
    top:50%;
    transform:translateY(-50%);
    color:#7d8899;
    font-size:19px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
}

.categoryBtn{
    white-space:nowrap;
    padding:10px 17px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,.07);
    background:#101725;
    color:#98a2b3;
    font-size:12px;
}

.categoryBtn.active{
    background:linear-gradient(135deg,#00b8d4,#7c3aed);
    color:#fff;
    border-color:transparent;
}

.channelsGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:14px;
    margin-top:18px;
}

.channelCard{
    min-height:175px;
    padding:17px;
    border-radius:22px;
    background:#0c1320;
    border:1px solid rgba(255,255,255,.06);
    transition:.2s;
}

.channelCard:hover{
    transform:translateY(-3px);
    border-color:rgba(0,229,255,.3);
}

.channelCard.selected{
    border-color:#00e5ff;
    box-shadow:0 0 25px rgba(0,229,255,.10);
}

.channelLogo{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:12px;
}

.channelLogo img{
    max-width:105px;
    max-height:65px;
    object-fit:contain;
}

.logoPlaceholder{
    width:63px;
    height:63px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#101d32,#18243a);
    color:#00e5ff;
    font-size:22px;
}

.channelName{
    text-align:center;
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.channelMeta{
    display:flex;
    justify-content:center;
    gap:5px;
    margin-top:9px;
    flex-wrap:wrap;
}

.badge{
    padding:4px 7px;
    border-radius:7px;
    background:#172033;
    color:#aeb8c8;
    font-size:9px;
}

.badge.live{
    color:#22c55e;
}

.playBtn{
    width:100%;
    height:36px;
    margin-top:13px;
    border:0;
    border-radius:11px;
    background:rgba(0,229,255,.10);
    color:#00e5ff;
    font-size:11px;
    font-weight:bold;
}

.playBtn:hover{
    background:#00e5ff;
    color:#061018;
}

/* ================= PLAYER ================= */

.playerPanel{
    display:none;
    overflow:hidden;
    margin:20px 0;
    border-radius:22px;
    background:#05080e;
    border:1px solid rgba(255,255,255,.08);
}

.playerPanel.show{
    display:block;
}

.playerHeader{
    min-height:62px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#0c111c;
}

.currentChannel{
    display:flex;
    align-items:center;
    gap:10px;
}

.currentLogo{
    width:38px;
    height:38px;
    border-radius:10px;
    background:#151e2e;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.currentLogo img{
    max-width:32px;
    max-height:32px;
}

.currentInfo strong{
    display:block;
    font-size:13px;
}

.currentInfo span{
    display:block;
    margin-top:3px;
    color:#22c55e;
    font-size:10px;
}

.closePlayer{
    width:34px;
    height:34px;
    border:0;
    border-radius:10px;
    background:#172033;
    color:#fff;
}

.videoWrap{
    position:relative;
    aspect-ratio:16/9;
    background:#000;
}

#video{
    width:100%;
    height:100%;
    display:block;
    background:#000;
}

.playerOverlay{
    position:absolute;
    inset:0;
    z-index:4;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.65);
}

.playerOverlay.show{
    display:flex;
}

.loader{
    width:42px;
    height:42px;
    border:3px solid rgba(255,255,255,.15);
    border-top-color:#00e5ff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.playerActions{
    display:flex;
    gap:8px;
    padding:12px;
    background:#0b111d;
}

.playerAction{
    flex:1;
    height:40px;
    border:0;
    border-radius:10px;
    background:#151e2e;
    color:#fff;
}

.playerAction.primary{
    background:linear-gradient(135deg,#00b8d4,#7c3aed);
}

/* ================= NEWS ================= */

.newsGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:14px;
}

.newsCard{
    padding:20px;
    border-radius:20px;
    background:#0d1422;
    border:1px solid rgba(255,255,255,.06);
}

.newsCard h3{
    margin-bottom:10px;
    font-size:15px;
}

.newsCard p{
    color:#8994a6;
    font-size:13px;
    line-height:1.7;
}

/* ================= EMPTY ================= */

.emptyState{
    padding:45px 20px;
    text-align:center;
    color:#7f8a9c;
    border:1px dashed rgba(255,255,255,.08);
    border-radius:20px;
}

/* ================= NAV ================= */

.bottomNav{
    position:fixed;
    z-index:200;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    width:min(500px,calc(100% - 25px));
    height:65px;
    padding:7px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border-radius:22px;
    background:rgba(10,15,26,.94);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.navBtn{
    border:0;
    border-radius:16px;
    background:transparent;
    color:#788497;
    font-size:11px;
}

.navBtn span{
    display:block;
    margin-bottom:3px;
    font-size:18px;
}

.navBtn.active{
    color:#00e5ff;
    background:rgba(0,229,255,.07);
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    main{
        padding:15px;
    }

    header{
        padding:0 15px;
    }

    .hero{
        min-height:220px;
        padding:25px;
        border-radius:23px;
    }

    .hero h2{
        font-size:29px;
    }

    .matchesGrid{
        grid-template-columns:1fr;
    }

    .channelsGrid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .channelCard{
        min-height:165px;
        padding:13px;
        border-radius:18px;
    }

    .channelLogo{
        height:65px;
    }

    .channelName{
        font-size:12px;
    }

    .playBtn{
        font-size:10px;
    }

}

</style>
</head>

<body>

<header>

    <div class="brand">

        <div class="logoMark"></div>

        <div class="brandText">
            <h1>المستديرة</h1>
            <span>كل الرياضة بمكان واحد</span>
        </div>

    </div>

    <div class="liveStatus">
        <span class="liveDot"></span>
        مباشر
    </div>

</header>


<main>

<!-- ================= HOME ================= -->

<section id="homePage" class="page active">

    <div class="hero">

        <div class="heroContent">

            <div class="heroBadge">
                ⚽ منصة رياضية
            </div>

            <h2>
                كل الرياضة<br>
                بمكان واحد
            </h2>

            <p>
                تابع المباريات والقنوات الرياضية والأخبار
                من واجهة واحدة سريعة ومصممة للهواتف والتلفزيونات.
            </p>

        </div>

    </div>


    <div class="sectionTitle">

        <h2>مباريات اليوم</h2>

        <span
            class="count"
            id="homeMatchCount"
        ></span>

    </div>


    <div
        id="homeMatches"
        class="matchesGrid"
    ></div>

</section>


<!-- ================= MATCHES ================= -->

<section id="matchesPage" class="page">

    <div class="sectionTitle">

        <h2>المباريات</h2>

        <span
            class="count"
            id="matchCount"
        ></span>

    </div>


    <div class="dateBar">

        <button
            class="dateBtn active"
        >
            اليوم
        </button>

        <button
            class="dateBtn"
        >
            غداً
        </button>

        <button
            class="dateBtn"
        >
            بعد غد
        </button>

    </div>


    <div
        id="matches"
        class="matchesGrid"
    ></div>

</section>


<!-- ================= LIVE ================= -->

<section id="livePage" class="page">

    <div class="sectionTitle">

        <h2>البث المباشر</h2>

        <span
            class="count"
            id="channelCount"
        >
            0 قناة
        </span>

    </div>


    <div class="searchBox">

        <span class="searchIcon">
            ⌕
        </span>

        <input
            id="channelSearch"
            type="search"
            placeholder="ابحث عن قناة..."
            autocomplete="off"
        >

    </div>


    <div class="categories">

        <button
            class="categoryBtn active"
            data-category="ALL"
        >
            الكل
        </button>

        <button
            class="categoryBtn"
            data-category="رياضية"
        >
            رياضية
        </button>

        <button
            class="categoryBtn"
            data-category="عراقية"
        >
            عراقية
        </button>

        <button
            class="categoryBtn"
            data-category="خليجية"
        >
            خليجية
        </button>

        <button
            class="categoryBtn"
            data-category="عالمية"
        >
            عالمية
        </button>

    </div>


    <!-- PLAYER -->

    <div
        id="playerPanel"
        class="playerPanel"
    >

        <div class="playerHeader">

            <div class="currentChannel">

                <div
                    class="currentLogo"
                    id="currentLogo"
                ></div>

                <div class="currentInfo">

                    <strong
                        id="currentChannelName"
                    >
                        -
                    </strong>

                    <span
                        id="playerStatus"
                    >
                        جاهز
                    </span>

                </div>

            </div>


            <button
                class="closePlayer"
                onclick="closePlayer()"
            >
                ✕
            </button>

        </div>


        <div class="videoWrap">

            <video
                id="video"
                controls
                playsinline
                preload="metadata"
            ></video>

            <div
                id="playerOverlay"
                class="playerOverlay"
            >
                <div class="loader"></div>
            </div>

        </div>


        <div class="playerActions">

            <button
                class="playerAction"
                onclick="retryCurrentChannel()"
            >
                إعادة المحاولة
            </button>

            <button
                class="playerAction primary"
                onclick="fullscreenPlayer()"
            >
                ملء الشاشة
            </button>

        </div>

    </div>


    <div
        id="channels"
        class="channelsGrid"
    ></div>

</section>


<!-- ================= NEWS ================= -->

<section id="newsPage" class="page">

    <div class="sectionTitle">
        <h2>آخر الأخبار</h2>
    </div>

    <div
        id="news"
        class="newsGrid"
    ></div>

</section>

</main>


<!-- ================= NAV ================= -->

<nav class="bottomNav">

    <button
        class="navBtn active"
        onclick="openPage('homePage',this)"
    >
        <span>⌂</span>
        الرئيسية
    </button>

    <button
        class="navBtn"
        onclick="openPage('matchesPage',this)"
    >
        <span>⚽</span>
        المباريات
    </button>

    <button
        class="navBtn"
        onclick="openPage('livePage',this)"
    >
        <span>▶</span>
        البث
    </button>

    <button
        class="navBtn"
        onclick="openPage('newsPage',this)"
    >
        <span>▤</span>
        الأخبار
    </button>

</nav>


<script>

let appData={
    matches:[],
    channels:[],
    news:[]
};

let hlsPlayer=null;
let currentChannelIndex=-1;
let retryTimer=null;

let currentCategory="ALL";
let currentSearch="";


/* ================= LOAD ================= */

async function loadData(){

    try{

        const response=await fetch(
            "data.json?v="+Date.now()
        );

        if(!response.ok){
            throw new Error("Data error");
        }

        appData=await response.json();

        renderMatches();
        renderHomeMatches();
        renderChannels();
        renderNews();

    }catch(error){

        console.error(error);

        document.getElementById("channels").innerHTML=`
            <div class="emptyState">
                تعذر تحميل البيانات
            </div>
        `;

    }

}


/* ================= PAGE ================= */

function openPage(pageId,button){

    document
        .querySelectorAll(".page")
        .forEach(page=>{
            page.classList.remove("active");
        });

    const page=document.getElementById(pageId);

    if(page){
        page.classList.add("active");
    }

    document
        .querySelectorAll(".navBtn")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    if(button){
        button.classList.add("active");
    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ================= MATCH STATUS ================= */

function getMatchStatus(match){

    if(match.live===true){
        return `
            <span class="matchStatus statusLive">
                ● مباشر
            </span>
        `;
    }

    if(
        match.status &&
        (
            match.status.includes("انتهت") ||
            match.status.includes("انتهى")
        )
    ){
        return `
            <span class="matchStatus statusEnded">
                انتهت
            </span>
        `;
    }

    return `
        <span class="matchStatus statusSoon">
            قريباً
        </span>
    `;

}


/* ================= MATCH CARD ================= */

function createMatchCard(match){

    return `

        <div class="matchCard">

            <div class="matchTop">

                <span class="league">
                    ${match.league || "مباراة"}
                </span>

                ${getMatchStatus(match)}

            </div>


            <div class="matchTeams">

                <div class="matchTeam">

                    <div class="teamIcon">
                        ⚽
                    </div>

                    <div class="teamName">
                        ${match.team1 || "-"}
                    </div>

                </div>


                <div class="matchCenter">

                    <div class="matchTime">
                        ${match.time || "--:--"}
                    </div>

                    <div class="matchDate">
                        اليوم
                    </div>

                </div>


                <div class="matchTeam">

                    <div class="teamIcon">
                        ⚽
                    </div>

                    <div class="teamName">
                        ${match.team2 || "-"}
                    </div>

                </div>

            </div>


            <div class="matchBottom">

                ${match.status || "لم تبدأ"}

            </div>

        </div>

    `;

}


/* ================= MATCHES ================= */

function renderMatches(){

    const container=
        document.getElementById("matches");

    const count=
        document.getElementById("matchCount");

    const matches=
        appData.matches || [];

    if(count){
        count.textContent=
            matches.length+" مباراة";
    }

    if(!matches.length){

        container.innerHTML=`
            <div class="emptyState">
                لا توجد مباريات حالياً
            </div>
        `;

        return;
    }

    container.innerHTML=
        matches
        .map(createMatchCard)
        .join("");

}


function renderHomeMatches(){

    const container=
        document.getElementById("homeMatches");

    const count=
        document.getElementById("homeMatchCount");

    const matches=
        appData.matches || [];

    if(count){
        count.textContent=
            matches.length+" مباراة";
    }

    if(!container) return;

    container.innerHTML=
        matches
        .slice(0,4)
        .map(createMatchCard)
        .join("");

}


/* ================= CHANNEL FILTER ================= */

function getFilteredChannels(){

    const channels=
        (appData.channels || [])
        .filter(channel=>
            channel.enabled!==false
        );

    return channels.filter(channel=>{

        const categoryMatch=
            currentCategory==="ALL" ||
            channel.category===currentCategory;

        const search=
            currentSearch
            .trim()
            .toLowerCase();

        const searchMatch=
            !search ||
            String(channel.name||"")
                .toLowerCase()
                .includes(search) ||
            String(channel.category||"")
                .toLowerCase()
                .includes(search);

        return categoryMatch && searchMatch;

    });

}


/* ================= CHANNELS ================= */

function renderChannels(){

    const container=
        document.getElementById("channels");

    const count=
        document.getElementById("channelCount");

    const channels=
        getFilteredChannels();

    if(count){
        count.textContent=
            channels.length+" قناة";
    }

    if(!channels.length){

        container.innerHTML=`
            <div class="emptyState">
                لا توجد قنوات مطابقة
            </div>
        `;

        return;
    }


    container.innerHTML=
        channels.map(channel=>{

            const realIndex=
                appData.channels.indexOf(channel);

            const hasUrl=
                channel.url &&
                channel.url.trim()!=="";

            let logo="";

            if(channel.logo){

                logo=`
                    <img
                        src="${channel.logo}"
                        alt=""
                        loading="lazy"
                    >
                `;

            }else{

                logo=`
                    <div class="logoPlaceholder">
                        ⚽
                    </div>
                `;

            }


            const selected=
                realIndex===currentChannelIndex
                ? "selected"
                : "";


            return `

                <div class="channelCard ${selected}">

                    <div class="channelLogo">
                        ${logo}
                    </div>

                    <div class="channelName">
                        ${channel.name || "قناة رياضية"}
                    </div>

                    <div class="channelMeta">

                        <span class="badge">
                            ${channel.category || "رياضية"}
                        </span>

                        <span class="badge">
                            ${channel.quality || "HD"}
                        </span>

                        ${
                            hasUrl
                            ?
                            `
                                <span class="badge live">
                                    ● مباشر
                                </span>
                            `
                            :
                            `
                                <span class="badge">
                                    قريباً
                                </span>
                            `
                        }

                    </div>

                    <button
                        class="playBtn"
                        onclick="playChannel(${realIndex})"
                    >
                        ${
                            hasUrl
                            ?
                            "▶ تشغيل القناة"
                            :
                            "الرابط غير مضاف"
                        }
                    </button>

                </div>

            `;

        }).join("");

}


/* ================= PLAY ================= */

function playChannel(index){

    const channel=
        appData.channels[index];

    if(!channel) return;

    currentChannelIndex=index;

    renderChannels();


    if(
        !channel.url ||
        !channel.url.trim()
    ){

        alert(
            "رابط البث غير مضاف لهذه القناة حالياً"
        );

        return;
    }


    document
        .getElementById("playerPanel")
        .classList.add("show");


    document
        .getElementById("currentChannelName")
        .textContent=
            channel.name || "قناة";


    document
        .getElementById("playerStatus")
        .textContent=
            "جاري التشغيل...";


    const logoBox=
        document.getElementById("currentLogo");


    if(channel.logo){

        logoBox.innerHTML=`
            <img
                src="${channel.logo}"
                alt=""
            >
        `;

    }else{

        logoBox.innerHTML="⚽";

    }


    startStream(channel);


    setTimeout(()=>{

        document
            .getElementById("playerPanel")
            .scrollIntoView({
                behavior:"smooth",
                block:"start"
            });

    },100);

}


/* ================= STREAM ================= */

function startStream(channel){

    clearTimeout(retryTimer);

    const video=
        document.getElementById("video");

    const overlay=
        document.getElementById("playerOverlay");

    overlay.classList.add("show");


    if(hlsPlayer){

        hlsPlayer.destroy();
        hlsPlayer=null;

    }


    video.pause();
    video.removeAttribute("src");
    video.load();


    const url=
        channel.url.trim();


    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src=url;

        video.addEventListener(
            "loadedmetadata",
            onVideoReady,
            {once:true}
        );

        video.addEventListener(
            "error",
            onVideoError,
            {once:true}
        );

        video.play().catch(()=>{});

        return;
    }


    if(
        typeof Hls!=="undefined" &&
        Hls.isSupported()
    ){

        hlsPlayer=
            new Hls({
                enableWorker:true,
                lowLatencyMode:true,
                backBufferLength:30
            });


        hlsPlayer.loadSource(url);

        hlsPlayer.attachMedia(video);


        hlsPlayer.on(
            Hls.Events.MANIFEST_PARSED,
            ()=>{

                onVideoReady();

                video.play().catch(()=>{});

            }
        );


        hlsPlayer.on(
            Hls.Events.ERROR,
            (event,data)=>{

                onStreamError(data);

            }
        );

        return;
    }


    overlay.classList.remove("show");

    document
        .getElementById("playerStatus")
        .textContent=
            "المتصفح لا يدعم هذا البث";

}


/* ================= PLAYER EVENTS ================= */

function onVideoReady(){

    document
        .getElementById("playerOverlay")
        .classList.remove("show");

    document
        .getElementById("playerStatus")
        .textContent=
            "● مباشر";

}


function onVideoError(){

    document
        .getElementById("playerOverlay")
        .classList.remove("show");

    document
        .getElementById("playerStatus")
        .textContent=
            "حدث خطأ في البث";

    scheduleRetry();

}


function onStreamError(data){

    if(!data || !data.fatal){
        return;
    }


    if(
        data.type===
        Hls.ErrorTypes.NETWORK_ERROR
    ){

        document
            .getElementById("playerStatus")
            .textContent=
                "إعادة الاتصال...";

        try{

            hlsPlayer.startLoad();

        }catch(e){

            scheduleRetry();

        }

        return;
    }


    if(
        data.type===
        Hls.ErrorTypes.MEDIA_ERROR
    ){

        try{

            hlsPlayer.recoverMediaError();

        }catch(e){

            scheduleRetry();

        }

        return;
    }


    scheduleRetry();

}


/* ================= RETRY ================= */

function scheduleRetry(){

    clearTimeout(retryTimer);

    document
        .getElementById("playerStatus")
        .textContent=
            "إعادة المحاولة خلال 3 ثواني...";

    retryTimer=
        setTimeout(
            retryCurrentChannel,
            3000
        );

}


function retryCurrentChannel(){

    if(currentChannelIndex<0){
        return;
    }

    const channel=
        appData.channels[currentChannelIndex];

    if(channel){
        startStream(channel);
    }

}


/* ================= CLOSE ================= */

function closePlayer(){

    clearTimeout(retryTimer);

    const video=
        document.getElementById("video");


    if(hlsPlayer){

        hlsPlayer.destroy();
        hlsPlayer=null;

    }


    video.pause();

    video.removeAttribute("src");

    video.load();


    document
        .getElementById("playerPanel")
        .classList.remove("show");


    currentChannelIndex=-1;

    renderChannels();

}


/* ================= FULLSCREEN ================= */

function fullscreenPlayer(){

    const video=
        document.getElementById("video");

    if(video.requestFullscreen){

        video.requestFullscreen();

    }else if(video.webkitEnterFullscreen){

        video.webkitEnterFullscreen();

    }

}


/* ================= SEARCH ================= */

document
    .getElementById("channelSearch")
    .addEventListener(
        "input",
        function(){

            currentSearch=
                this.value;

            renderChannels();

        }
    );


/* ================= CATEGORY ================= */

document
    .querySelectorAll(".categoryBtn")
    .forEach(button=>{

        button.addEventListener(
            "click",
            function(){

                document
                    .querySelectorAll(".categoryBtn")
                    .forEach(btn=>{
                        btn.classList.remove("active");
                    });

                this.classList.add("active");

                currentCategory=
                    this.dataset.category;

                renderChannels();

            }
        );

    });


/* ================= DATE ================= */

document
    .querySelectorAll(".dateBtn")
    .forEach(button=>{

        button.addEventListener(
            "click",
            function(){

                document
                    .querySelectorAll(".dateBtn")
                    .forEach(btn=>{
                        btn.classList.remove("active");
                    });

                this.classList.add("active");

            }
        );

    });


/* ================= NEWS ================= */

function renderNews(){

    const container=
        document.getElementById("news");

    const news=
        appData.news || [];

    if(!news.length){

        container.innerHTML=`
            <div class="emptyState">
                لا توجد أخبار حالياً
            </div>
        `;

        return;
    }


    container.innerHTML=
        news.map(item=>`

            <article class="newsCard">

                <h3>
                    ${item.title || "خبر رياضي"}
                </h3>

                <p>
                    ${item.description || ""}
                </p>

            </article>

        `).join("");

}


/* ================= START ================= */

loadData();

</script>
