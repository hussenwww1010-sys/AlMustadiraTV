<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#070b14">

<title>المستديرة</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Tahoma, sans-serif;
    background:
        radial-gradient(circle at 20% 0%, rgba(0,229,255,.08), transparent 30%),
        radial-gradient(circle at 100% 20%, rgba(168,85,247,.10), transparent 30%),
        #070b14;
    color:#fff;
    min-height:100vh;
    padding-bottom:85px;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:100;
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    background:rgba(7,11,20,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.06);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logoMark{
    width:42px;
    height:42px;
    border-radius:14px;
    position:relative;
    background:linear-gradient(135deg,#00e5ff,#7c3aed);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 0 25px rgba(0,229,255,.2);
}

.logoMark::before{
    content:"";
    width:19px;
    height:19px;
    border:2px solid #fff;
    border-radius:50%;
}

.logoMark::after{
    content:"";
    position:absolute;
    width:30px;
    height:11px;
    border:2px solid rgba(255,255,255,.9);
    border-left-color:transparent;
    border-right-color:transparent;
    border-radius:50%;
    transform:rotate(-25deg);
}

.brandText h1{
    font-size:20px;
    font-weight:900;
}

.brandText span{
    display:block;
    margin-top:3px;
    font-size:10px;
    color:#9ca3af;
}

.liveStatus{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:12px;
    color:#9ca3af;
}

.liveDot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 12px #22c55e;
}

/* ================= MAIN ================= */

main{
    max-width:1250px;
    margin:auto;
    padding:22px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* ================= HERO ================= */

.hero{
    position:relative;
    overflow:hidden;
    min-height:250px;
    padding:35px;
    border-radius:28px;
    background:
        radial-gradient(circle at 80% 20%,rgba(0,229,255,.20),transparent 35%),
        radial-gradient(circle at 10% 100%,rgba(168,85,247,.22),transparent 40%),
        linear-gradient(135deg,#10182b,#0b1020);
    border:1px solid rgba(255,255,255,.07);
    margin-bottom:25px;
}

.hero::before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:50%;
    left:-90px;
    top:-100px;
}

.heroContent{
    position:relative;
    z-index:2;
    max-width:650px;
}

.heroBadge{
    display:inline-flex;
    padding:7px 12px;
    border-radius:30px;
    background:rgba(0,229,255,.10);
    color:#00e5ff;
    font-size:12px;
    margin-bottom:14px;
}

.hero h2{
    font-size:38px;
    line-height:1.2;
    margin-bottom:12px;
}

.hero p{
    color:#aeb7c7;
    line-height:1.8;
    font-size:15px;
}

/* ================= SECTION ================= */

.sectionTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 0 15px;
}

.sectionTitle h2{
    font-size:20px;
}

.count{
    color:#8993a5;
    font-size:12px;
}

/* ================= MATCHES ================= */

.dateBar{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:5px;
}

.dateBtn{
    min-width:100px;
    padding:12px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.08);
    background:#101725;
    color:#aab3c3;
}

.dateBtn.active{
    color:#fff;
    background:linear-gradient(135deg,#00a8c4,#6d28d9);
    border-color:transparent;
}

.matchesGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:14px;
}

.matchCard{
    padding:18px;
    border-radius:20px;
    background:#0d1422;
    border:1px solid rgba(255,255,255,.06);
}

.league{
    color:#8e9aad;
    font-size:11px;
    margin-bottom:15px;
}

.teams{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:10px;
    text-align:center;
}

.team{
    font-size:14px;
    font-weight:bold;
}

.vs{
    color:#667085;
    font-size:11px;
}

.matchTime{
    text-align:center;
    margin-top:15px;
    color:#00e5ff;
    font-size:13px;
}

/* ================= LIVE ================= */

.liveTop{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.searchBox{
    position:relative;
}

.searchBox input{
    width:100%;
    height:52px;
    padding:0 48px 0 18px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,.08);
    outline:none;
    background:#0d1422;
    color:#fff;
    font-size:14px;
}

.searchBox input:focus{
    border-color:rgba(0,229,255,.5);
}

.searchIcon{
    position:absolute;
    right:17px;
    top:50%;
    transform:translateY(-50%);
    color:#7e899b;
    font-size:18px;
}

.categories{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
}

.categoryBtn{
    white-space:nowrap;
    padding:10px 17px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,.07);
    background:#101725;
    color:#98a2b3;
    font-size:12px;
}

.categoryBtn.active{
    background:linear-gradient(135deg,#00b8d4,#7c3aed);
    color:#fff;
    border-color:transparent;
}

.channelsGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:14px;
    margin-top:18px;
}

.channelCard{
    position:relative;
    overflow:hidden;
    min-height:175px;
    padding:18px;
    border-radius:22px;
    background:
        linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.015)),
        #0c1320;
    border:1px solid rgba(255,255,255,.06);
    transition:.2s;
}

.channelCard:hover{
    transform:translateY(-3px);
    border-color:rgba(0,229,255,.35);
}

.channelCard.selected{
    border-color:#00e5ff;
    box-shadow:0 0 25px rgba(0,229,255,.10);
}

.channelLogo{
    height:75px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:12px;
}

.channelLogo img{
    max-width:100px;
    max-height:65px;
    object-fit:contain;
}

.logoPlaceholder{
    width:65px;
    height:65px;
    border-radius:18px;
    background:linear-gradient(135deg,#101d32,#18243a);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#00e5ff;
    font-weight:900;
    font-size:22px;
}

.channelName{
    font-size:14px;
    font-weight:bold;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.channelMeta{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-top:9px;
}

.badge{
    padding:4px 7px;
    border-radius:7px;
    font-size:9px;
    background:#172033;
    color:#aeb8c8;
}

.badge.live{
    color:#22c55e;
}

.playBtn{
    width:100%;
    margin-top:13px;
    height:36px;
    border:0;
    border-radius:11px;
    background:rgba(0,229,255,.10);
    color:#00e5ff;
    font-size:12px;
    font-weight:bold;
}

.playBtn:hover{
    background:#00e5ff;
    color:#061018;
}

.emptyState{
    text-align:center;
    padding:45px 20px;
    color:#7f8a9c;
    border:1px dashed rgba(255,255,255,.08);
    border-radius:20px;
}

/* ================= PLAYER ================= */

.playerPanel{
    margin-bottom:20px;
    background:#05080e;
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    overflow:hidden;
    display:none;
}

.playerPanel.show{
    display:block;
}

.playerHeader{
    min-height:62px;
    padding:12px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#0c111c;
}

.currentChannel{
    display:flex;
    align-items:center;
    gap:10px;
}

.currentLogo{
    width:38px;
    height:38px;
    border-radius:10px;
    background:#151e2e;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.currentLogo img{
    max-width:32px;
    max-height:32px;
}

.currentInfo strong{
    display:block;
    font-size:13px;
}

.currentInfo span{
    display:block;
    color:#22c55e;
    font-size:10px;
    margin-top:3px;
}

.closePlayer{
    width:34px;
    height:34px;
    border:0;
    border-radius:10px;
    background:#172033;
    color:#fff;
}

.videoWrap{
    position:relative;
    background:#000;
    aspect-ratio:16/9;
}

#video{
    width:100%;
    height:100%;
    display:block;
    background:#000;
}

.playerOverlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.65);
    z-index:4;
}

.playerOverlay.show{
    display:flex;
}

.loader{
    width:42px;
    height:42px;
    border:3px solid rgba(255,255,255,.15);
    border-top-color:#00e5ff;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.playerActions{
    display:flex;
    gap:8px;
    padding:12px;
    background:#0b111d;
}

.playerAction{
    flex:1;
    height:40px;
    border:0;
    border-radius:10px;
    background:#151e2e;
    color:#fff;
}

.playerAction.primary{
    background:linear-gradient(135deg,#00b8d4,#7c3aed);
}

/* ================= NEWS ================= */

.newsGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:14px;
}

.newsCard{
    padding:20px;
    border-radius:20px;
    background:#0d1422;
    border:1px solid rgba(255,255,255,.06);
}

.newsCard h3{
    font-size:15px;
    margin-bottom:10px;
}

.newsCard p{
    color:#8994a6;
    line-height:1.7;
    font-size:13px;
}

/* ================= BOTTOM NAV ================= */

.bottomNav{
    position:fixed;
    z-index:200;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    width:min(500px,calc(100% - 25px));
    height:65px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:7px;
    border-radius:22px;
    background:rgba(10,15,26,.94);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.navBtn{
    border:0;
    border-radius:16px;
    background:transparent;
    color:#788497;
    font-size:11px;
}

.navBtn span{
    display:block;
    font-size:18px;
    margin-bottom:3px;
}

.navBtn.active{
    color:#00e5ff;
    background:rgba(0,229,255,.07);
}

/* ================= RESPONSIVE ================= */

@media(max-width:600px){

    main{
        padding:15px;
    }

    header{
        padding:0 15px;
    }

    .hero{
        min-height:220px;
        padding:25px;
        border-radius:23px;
    }

    .hero h2{
        font-size:29px;
    }

    .channelsGrid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .channelCard{
        min-height:165px;
        padding:13px;
        border-radius:18px;
    }

    .channelLogo{
        height:65px;
    }

    .channelName{
        font-size:12px;
    }

    .playBtn{
        font-size:10px;
    }
}

</style>
</head>

<body>

<header>

    <div class="brand">

        <div class="logoMark"></div>

        <div class="brandText">
            <h1>المستديرة</h1>
            <span>كل الرياضة بمكان واحد</span>
        </div>

    </div>

    <div class="liveStatus">
        <span class="liveDot"></span>
        مباشر
    </div>

</header>


<main>

<!-- ================= HOME ================= -->

<section id="homePage" class="page active">

    <div class="hero">

        <div class="heroContent">

            <div class="heroBadge">
                ⚽ منصة رياضية
            </div>

            <h2>
                كل الرياضة<br>
                بمكان واحد
            </h2>

            <p>
                تابع المباريات والقنوات الرياضية والأخبار
                من واجهة واحدة سريعة ومصممة للهواتف والتلفزيونات.
            </p>

        </div>

    </div>

    <div class="sectionTitle">
        <h2>المباريات</h2>
        <span class="count" id="homeMatchCount"></span>
    </div>

    <div id="homeMatches" class="matchesGrid"></div>

</section>


<!-- ================= MATCHES ================= -->

<section id="matchesPage" class="page">

    <div class="sectionTitle">
        <h2>المباريات</h2>
    </div>

    <div class="dateBar">

        <button class="dateBtn active">
            اليوم
        </button>

        <button class="dateBtn">
            غداً
        </button>

        <button class="dateBtn">
            بعد غد
        </button>

    </div>

    <div id="matches" class="matchesGrid"></div>

</section>


<!-- ================= LIVE ================= -->

<section id="livePage" class="page">

    <div class="sectionTitle">

        <h2>البث المباشر</h2>

        <span class="count" id="channelCount">
            0 قناة
        </span>

    </div>


    <div class="liveTop">

        <div class="searchBox">

            <span class="searchIcon">⌕</span>

            <input
                id="channelSearch"
                type="search"
                placeholder="ابحث عن قناة..."
                autocomplete="off"
            >

        </div>


        <div class="categories">

            <button
                class="categoryBtn active"
                data-category="ALL"
            >
                الكل
            </button>

            <button
                class="categoryBtn"
                data-category="رياضية"
            >
                رياضية
            </button>

            <button
                class="categoryBtn"
                data-category="عراقية"
            >
                عراقية
            </button>

            <button
                class="categoryBtn"
                data-category="خليجية"
            >
                خليجية
            </button>

            <button
                class="categoryBtn"
                data-category="عالمية"
            >
                عالمية
            </button>

        </div>

    </div>


    <div id="playerPanel" class="playerPanel">

        <div class="playerHeader">

            <div class="currentChannel">

                <div class="currentLogo" id="currentLogo"></div>

                <div class="currentInfo">

                    <strong id="currentChannelName">
                        -
                    </strong>

                    <span id="playerStatus">
                        جاهز
                    </span>

                </div>

            </div>

            <button
                class="closePlayer"
                onclick="closePlayer()"
            >
                ✕
            </button>

        </div>


        <div class="videoWrap">

            <video
                id="video"
                controls
                playsinline
                preload="metadata"
            ></video>

            <div
                id="playerOverlay"
                class="playerOverlay"
            >

                <div class="loader"></div>

            </div>

        </div>


        <div class="playerActions">

            <button
                class="playerAction"
                onclick="retryCurrentChannel()"
            >
                إعادة المحاولة
            </button>

            <button
                class="playerAction primary"
                onclick="fullscreenPlayer()"
            >
                ملء الشاشة
            </button>

        </div>

    </div>


    <div
        id="channels"
        class="channelsGrid"
    ></div>

</section>


<!-- ================= NEWS ================= -->

<section id="newsPage" class="page">

    <div class="sectionTitle">
        <h2>آخر الأخبار</h2>
    </div>

    <div id="news" class="newsGrid"></div>

</section>

</main>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottomNav">

    <button
        class="navBtn active"
        data-page="homePage"
        onclick="openPage('homePage',this)"
    >
        <span>⌂</span>
        الرئيسية
    </button>

    <button
        class="navBtn"
        data-page="matchesPage"
        onclick="openPage('matchesPage',this)"
    >
        <span>⚽</span>
        المباريات
    </button>

    <button
        class="navBtn"
        data-page="livePage"
        onclick="openPage('livePage',this)"
    >
        <span>▶</span>
        البث
    </button>

    <button
        class="navBtn"
        data-page="newsPage"
        onclick="openPage('newsPage',this)"
    >
        <span>▤</span>
        الأخبار
    </button>

</nav>


<script>

let appData = {
    matches: [],
    channels: [],
    news: []
};

let hlsPlayer = null;
let currentChannelIndex = -1;
let retryTimer = null;

let currentCategory = "ALL";
let currentSearch = "";


/* ================= LOAD DATA ================= */

async function loadData(){

    try{

        const response = await fetch(
            "data.json?v=" + Date.now()
        );

        if(!response.ok){
            throw new Error("Data loading failed");
        }

        appData = await response.json();

        renderMatches();
        renderHomeMatches();
        renderChannels();
        renderNews();

    }catch(error){

        console.error(error);

        document.getElementById("channels").innerHTML = `
            <div class="emptyState">
                تعذر تحميل بيانات الموقع
            </div>
        `;

    }

}


/* ================= PAGE ================= */

function openPage(pageId, button){

    document.querySelectorAll(".page")
        .forEach(page => page.classList.remove("active"));

    const page = document.getElementById(pageId);

    if(page){
        page.classList.add("active");
    }

    document.querySelectorAll(".navBtn")
        .forEach(btn => btn.classList.remove("active"));

    if(button){
        button.classList.add("active");
    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* ================= MATCHES ================= */

function createMatchCard(match){

    return `

        <div class="matchCard">

            <div class="league">
                ${match.league || "مباراة"}
            </div>

            <div class="teams">

                <div class="team">
                    ${match.team1 || "-"}
                </div>

                <div class="vs">
                    VS
                </div>

                <div class="team">
                    ${match.team2 || "-"}
                </div>

            </div>

            <div class="matchTime">
                ${match.time || ""}
            </div>

        </div>

    `;

}


function renderMatches(){

    const container =
        document.getElementById("matches");

    if(!container) return;

    const matches =
        appData.matches || [];

    container.innerHTML =
        matches.length
        ? matches.map(createMatchCard).join("")
        : `
            <div class="emptyState">
                لا توجد مباريات حالياً
            </div>
        `;

}


function renderHomeMatches(){

    const container =
        document.getElementById("homeMatches");

    const count =
        document.getElementById("homeMatchCount");

    const matches =
        appData.matches || [];

    if(count){
        count.textContent =
            matches.length + " مباراة";
    }

    if(!container) return;

    container.innerHTML =
        matches.slice(0,4).map(createMatchCard).join("");

}


/* ================= CHANNEL FILTER ================= */

function getFilteredChannels(){

    const channels =
        (appData.channels || [])
        .filter(channel =>
            channel.enabled !== false
        );

    return channels.filter(channel => {

        const categoryMatch =
            currentCategory === "ALL" ||
            channel.category === currentCategory;

        const searchText =
            currentSearch.trim().toLowerCase();

        const searchMatch =
            !searchText ||
            String(channel.name || "")
                .toLowerCase()
                .includes(searchText) ||
            String(channel.category || "")
                .toLowerCase()
                .includes(searchText);

        return categoryMatch && searchMatch;

    });

}


/* ================= CHANNELS ================= */

function renderChannels(){

    const container =
        document.getElementById("channels");

    const count =
        document.getElementById("channelCount");

    if(!container) return;

    const channels =
        getFilteredChannels();

    if(count){

        count.textContent =
            channels.length +
            (channels.length === 1 ? " قناة" : " قناة");

    }


    if(!channels.length){

        container.innerHTML = `
            <div class="emptyState">
                لا توجد قنوات مطابقة للبحث
            </div>
        `;

        return;

    }


    container.innerHTML =
        channels.map(channel => {

            const realIndex =
                appData.channels.indexOf(channel);

            const logo =
                channel.logo
                ? `
                    <img
                        src="${channel.logo}"
                        alt=""
                        loading="lazy"
                        onerror="this.style.display='none'"
                    >
                `
                : `
                    <div class="logoPlaceholder">
                        ⚽
                    </div>
                `;

            const selected =
                realIndex === currentChannelIndex
                ? "selected"
                : "";

            const hasUrl =
                channel.url &&
                channel.url.trim() !== "";

            return `

                <div class="channelCard ${selected}">

                    <div class="channelLogo">
                        ${logo}
                    </div>

                    <div class="channelName">
                        ${channel.name || "قناة رياضية"}
                    </div>

                    <div class="channelMeta">

                        <span class="badge">
                            ${channel.category || "رياضية"}
                        </span>

                        <span class="badge">
                            ${channel.quality || "HD"}
                        </span>

                        ${
                            hasUrl
                            ? `
                                <span class="badge live">
                                    ● مباشر
                                </span>
                            `
                            : `
                                <span class="badge">
                                    قريباً
                                </span>
                            `
                        }

                    </div>

                    <button
                        class="playBtn"
                        onclick="playChannel(${realIndex})"
                    >
                        ${
                            hasUrl
                            ? "▶ تشغيل القناة"
                            : "الرابط غير مضاف"
                        }
                    </button>

                </div>

            `;

        }).join("");

}


/* ================= PLAY CHANNEL ================= */

function playChannel(index){

    const channel =
        appData.channels[index];

    if(!channel){
        return;
    }

    currentChannelIndex = index;

    renderChannels();

    if(!channel.url || !channel.url.trim()){

        alert(
            "رابط البث غير مضاف لهذه القناة حالياً"
        );

        return;

    }

    const playerPanel =
        document.getElementById("playerPanel");

    playerPanel.classList.add("show");

    document.getElementById(
        "currentChannelName"
    ).textContent = channel.name || "قناة";

    document.getElementById(
        "playerStatus"
    ).textContent = "جاري التشغيل...";


    const logoBox =
        document.getElementById("currentLogo");

    if(channel.logo){

        logoBox.innerHTML = `
            <img
                src="${channel.logo}"
                alt=""
            >
        `;

    }else{

        logoBox.innerHTML = "⚽";

    }


    startStream(channel);

    setTimeout(() => {

        playerPanel.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    },100);

}


/* ================= STREAM ================= */

function startStream(channel){

    clearTimeout(retryTimer);

    const video =
        document.getElementById("video");

    const overlay =
        document.getElementById("playerOverlay");

    overlay.classList.add("show");

    if(hlsPlayer){

        hlsPlayer.destroy();
        hlsPlayer = null;

    }

    video.pause();

    video.removeAttribute("src");

    video.load();


    const url =
        channel.url.trim();


    /*
        iPhone / Safari
        يستخدم HLS الأصلي
    */

    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src = url;

        video.addEventListener(
            "loadedmetadata",
            onVideoReady,
            {once:true}
        );

        video.addEventListener(
            "error",
            onVideoError,
            {once:true}
        );

        video.play().catch(() => {});

        return;

    }


    /*
        باقي المتصفحات
        تستخدم HLS.js
    */

    if(
        typeof Hls !== "undefined" &&
        Hls.isSupported()
    ){

        hlsPlayer =
            new Hls({
                enableWorker:true,
                lowLatencyMode:true,
                backBufferLength:30
            });

        hlsPlayer.loadSource(url);

        hlsPlayer.attachMedia(video);

        hlsPlayer.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                onVideoReady();

                video.play().catch(() => {});

            }
        );


        hlsPlayer.on(
            Hls.Events.ERROR,
            (event,data) => {

                console.log(
                    "HLS ERROR",
                    data
                );

                onStreamError(data);

            }
        );

        return;

    }


    overlay.classList.remove("show");

    document.getElementById(
        "playerStatus"
    ).textContent =
        "المتصفح لا يدعم هذا البث";

}


/* ================= PLAYER READY ================= */

function onVideoReady(){

    document
        .getElementById("playerOverlay")
        .classList.remove("show");

    document
        .getElementById("playerStatus")
        .textContent =
        "● مباشر";

}


/* ================= VIDEO ERROR ================= */

function onVideoError(){

    document
        .getElementById("playerOverlay")
        .classList.remove("show");

    document
        .getElementById("playerStatus")
        .textContent =
        "حدث خطأ في البث";

    scheduleRetry();

}


/* ================= HLS ERROR ================= */

function onStreamError(data){

    if(!data){
        return;
    }

    if(data.fatal){

        if(data.type === Hls.ErrorTypes.NETWORK_ERROR){

            document
                .getElementById("playerStatus")
                .textContent =
                "إعادة الاتصال...";

            try{

                hlsPlayer.startLoad();

            }catch(e){

                scheduleRetry();

            }

        }

        else if(
            data.type === Hls.ErrorTypes.MEDIA_ERROR
        ){

            try{

                hlsPlayer.recoverMediaError();

            }catch(e){

                scheduleRetry();

            }

        }

        else{

            scheduleRetry();

        }

    }

}


/* ================= RETRY ================= */

function scheduleRetry(){

    clearTimeout(retryTimer);

    document
        .getElementById("playerStatus")
        .textContent =
        "إعادة المحاولة خلال 3 ثواني...";

    retryTimer =
        setTimeout(() => {

            retryCurrentChannel();

        },3000);

}


function retryCurrentChannel(){

    if(currentChannelIndex < 0){
        return;
    }

    const channel =
        appData.channels[currentChannelIndex];

    if(channel){
        startStream(channel);
    }

}


/* ================= CLOSE PLAYER ================= */

function closePlayer(){

    clearTimeout(retryTimer);

    const video =
        document.getElementById("video");

    if(hlsPlayer){

        hlsPlayer.destroy();
        hlsPlayer = null;

    }

    video.pause();

    video.removeAttribute("src");

    video.load();

    document
        .getElementById("playerPanel")
        .classList.remove("show");

    currentChannelIndex = -1;

    renderChannels();

}


/* ================= FULLSCREEN ================= */

function fullscreenPlayer(){

    const video =
        document.getElementById("video");

    if(video.requestFullscreen){

        video.requestFullscreen();

    }else if(video.webkitEnterFullscreen){

        video.webkitEnterFullscreen();

    }

}


/* ================= SEARCH ================= */

document
    .getElementById("channelSearch")
    .addEventListener(
        "input",
        function(){

            currentSearch =
                this.value;

            renderChannels();

        }
    );


/* ================= CATEGORIES ================= */

document
    .querySelectorAll(".categoryBtn")
    .forEach(button => {

        button.addEventListener(
            "click",
            function(){

                document
                    .querySelectorAll(".categoryBtn")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );

                this.classList.add("active");

                currentCategory =
                    this.dataset.category;

                renderChannels();

            }
        );

    });


/* ================= DATE BUTTONS ================= */

document
    .querySelectorAll(".dateBtn")
    .forEach(button => {

        button.addEventListener(
            "click",
            function(){

                document
                    .querySelectorAll(".dateBtn")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );

                this.classList.add("active");

            }
        );

    });


/* ================= START ================= */

loadData();

</script>
